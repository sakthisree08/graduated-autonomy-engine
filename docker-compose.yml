version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graduated-autonomy-engine
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/graduated_autonomy.db
      - API_VERSION=v1
      - DEBUG=True
      - LLM_PROVIDER=mock
      - SECRET_KEY=dev-secret-key-change-in-production
      - LOG_LEVEL=INFO
    volumes:
      - ./backend/data:/app/data
      - ./backend/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
